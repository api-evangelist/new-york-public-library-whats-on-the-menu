aid: new-york-public-library-whats-on-the-menu
name: New York Public Library What's On The Menu
description: The New York Public Library's What's On The Menu project is a crowdsourced digital collection of over 17,000 historical
  restaurant menus from the New York City area dating back to the 1850s, with more than 1.3 million transcribed dishes. The
  dataset is modeled as four related entities (Menu, MenuPage, MenuItem, Dish) and distributed as bulk CSV downloads. A companion
  HTTP API formerly provided programmatic access to menus, pages, and dishes; the live site and api.menus.nypl.org were retired
  in January 2025, but the crowdsourced dataset remains available as a gzip archive on Amazon S3 alongside a data dictionary.
